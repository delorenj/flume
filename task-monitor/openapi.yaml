openapi: 3.0.3
info:
  title: Task Monitor API
  description: Real-time task monitoring and metrics service
  version: 1.0.0
servers:
  - url: http://localhost:15151
    description: Local development server

paths:
  /:
    get:
      summary: Root endpoint
      responses:
        '200':
          description: Service information
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  version:
                    type: string
                  status:
                    type: string

  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /tasks:
    get:
      summary: List tasks
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: agent_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskState'

  /tasks/active:
    get:
      summary: Get active tasks
      responses:
        '200':
          description: List of active tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskState'

  /tasks/stale:
    get:
      summary: Get stale tasks
      responses:
        '200':
          description: List of stale tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskState'

  /tasks/{task_id}:
    get:
      summary: Get task details
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskState'
        '404':
          description: Task not found

  /tasks/{task_id}/events:
    get:
      summary: Get task event history
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task event history
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                  event_count:
                    type: integer
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskEvent'
        '404':
          description: Task not found

  /metrics:
    get:
      summary: Get aggregate metrics
      responses:
        '200':
          description: Task metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskMetrics'

  /metrics/prometheus:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: Metrics in Prometheus format
          content:
            text/plain:
              schema:
                type: string

  /stats:
    get:
      summary: Get internal statistics
      responses:
        '200':
          description: Internal stats
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    TaskStatus:
      type: string
      enum:
        - pending
        - assigned
        - started
        - in_progress
        - paused
        - completed
        - failed
        - stale

    TaskEvent:
      type: object
      required:
        - task_id
        - event_type
        - timestamp
      properties:
        task_id:
          type: string
        event_type:
          type: string
        agent_id:
          type: string
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        data:
          type: object

    TaskState:
      type: object
      required:
        - task_id
        - status
        - created_at
        - updated_at
        - events
      properties:
        task_id:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        agent_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        assigned_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        failed_at:
          type: string
          format: date-time
        last_heartbeat:
          type: string
          format: date-time
        queue_time_seconds:
          type: number
        processing_time_seconds:
          type: number
        total_duration_seconds:
          type: number
        error_message:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/TaskEvent'

    TaskMetrics:
      type: object
      properties:
        total_tasks:
          type: integer
        tasks_by_status:
          type: object
          additionalProperties:
            type: integer
        tasks_by_agent:
          type: object
          additionalProperties:
            type: integer
        average_queue_time:
          type: number
        average_processing_time:
          type: number
        total_completed:
          type: integer
        total_failed:
          type: integer
        success_rate:
          type: number
        active_tasks:
          type: integer

    HealthStatus:
      type: object
      required:
        - status
        - timestamp
        - tasks_monitored
        - rabbitmq_connected
        - stale_tasks_count
        - uptime_seconds
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        tasks_monitored:
          type: integer
        rabbitmq_connected:
          type: boolean
        stale_tasks_count:
          type: integer
        uptime_seconds:
          type: number
        memory_usage_mb:
          type: number
