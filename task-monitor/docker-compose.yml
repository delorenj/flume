services:
  task-monitor:
    container_name: 33GOD-task-monitor
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    environment:
      # RabbitMQ settings
      TASK_MONITOR_RABBITMQ_URL: "amqp://${DEFAULT_USERNAME}:${DEFAULT_PASSWORD}@localhost:5672/"
      TASK_MONITOR_RABBITMQ_EXCHANGE: "amq.topic"
      TASK_MONITOR_RABBITMQ_QUEUE: "task_monitor"
      TASK_MONITOR_RABBITMQ_ROUTING_KEY: "task.lifecycle.*"

      # State management
      TASK_MONITOR_PERSISTENCE_ENABLED: "true"
      TASK_MONITOR_PERSISTENCE_PATH: "/data/task_state.json"
      TASK_MONITOR_PERSISTENCE_INTERVAL: "60"
      TASK_MONITOR_STALE_THRESHOLD: "300"
      TASK_MONITOR_RETENTION_HOURS: "24"

      # API settings
      TASK_MONITOR_API_HOST: "0.0.0.0"
      TASK_MONITOR_API_PORT: "15151"

      # Monitoring
      TASK_MONITOR_STALE_CHECK_INTERVAL: "60"
      TASK_MONITOR_METRICS_ENABLED: "true"

      # Logging
      TASK_MONITOR_LOG_LEVEL: "INFO"
    volumes:
      - task_data:/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:15151/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  task_data:
    driver: local
