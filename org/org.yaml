# Reporting lines INSIDE a department: agent_id -> the agent_id it reports to. The
# agent stays a member of its department (Holocene, which renders departments flat,
# reads nothing here); `flume org` nests it under the named manager.
reports_to: {}  # The vacant Brennan portfolio seat has no acting director.

defaults:
  unassigned_department:
    id: unassigned
    name: "Unassigned"
    order: 999

