# DeloHQ company definition — the operator's hand-edited org chart.
#
# Sibling of agents-registry.yaml. Consumed by Holocene's /api/modules/org/tree
# (@holocene/org-model merge) and by `flume org`. Keyed strictly by agent_id
# (the registry's top-level agent keys).
#
# Precedence: this file wins. Any agent NOT placed here is auto-derived from its
# project_path nesting (agents under a placed agent's directory nest into that
# department); anything still unplaced falls into "Unassigned" so the chart never
# breaks when the fleet grows. Edit this file and reload — the tree reshapes.
#
# Override the path with HERMES_ORG_PATH.
#
# TRACKED IN GIT: the real file is ~/code/33GOD/flume/org/org.yaml; ~/.hermes/org.yaml
# is a symlink to it. Edit either path in place (never replace the symlink with a
# copy), then commit + push flume.
#
# 2026-10-22 every registry employee is now placed explicitly (no inferred edges),
# the two phantoms (condaleeza, delocontainers-pm: no registry row, no profile, no
# unit; only ancient backups remember them) are gone, and a Workflows department
# exists under rererere. Placement is by evidence: .project.json / README / role.
#
# 2026-09-20 reconciled against agents-registry.yaml: removed 7 agent_ids that no
# longer exist (candybar-pm, coachingagentframework-pm, delodocs-pm, drumjangler-pm,
# hermes-agent-pm, intelliforia-voice-agent-pm, jacksnaps-pm) and placed the 11 real
# agents that were missing. Department assignment for those 11 was INFERRED from repo
# — correct any that are wrong; this file is the authority, not the inference.
