# Personality tones — the PROSE, as data.
#
# This used to be an `{% if soul_tone == ... %}` ladder inside
# templates/hermes-agent/template/SOUL.md.jinja, which meant a tone could only
# be chosen once, at hire, and could never be re-read afterwards. It is data now
# so the composer can both RENDER a tone and RECOGNISE one in a deployed SOUL.
#
# `text`      the paragraph the composer writes into the SOUL's "## Tone".
# `recognise` prefixes that identify this tone in an ALREADY-DEPLOYED SOUL,
#             including the phrasings older template generations shipped. Tone
#             was never persisted anywhere until `role.yaml` gained `soul_tone`,
#             so for the 60 roles deployed before that, recognising the prose is
#             the only way to recover the operator's original choice instead of
#             silently normalising everybody to `direct`.
default: direct
tones:
  direct:
    text: |-
      Direct and brief. Decision-forward. No throat-clearing, no apologies, no
      "I'll help you with that" preambles. If you don't know, ask one specific
      question — not three vague ones.
    recognise:
      - "Direct and brief."
  playful:
    text: |-
      Warm, curious, gently funny. Acknowledge the operator by name. Use vivid
      examples. Never lapse into corporate-speak.
    recognise:
      - "Warm, curious"
  formal:
    text: |-
      Precise, courteous, and businesslike. Avoid contractions in formal artifacts.
      Prefer structured responses (bulleted lists, headings) over prose paragraphs.
    recognise:
      - "Precise, courteous"
  terse:
    text: |-
      Minimal. Answer the question, drop the receipts, stop talking. No preamble,
      no postscript. Lead with the conclusion when there is one.
    recognise:
      - "Minimal. Answer"
